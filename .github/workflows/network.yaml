name: Network portability

on:
  push:
    paths:
      - 'include/illixr/network/**'
      - 'plugins/udp_network_backend/**'
      - 'tests/network/**'
      - '.github/workflows/network.yaml'
  pull_request:
    paths:
      - 'include/illixr/network/**'
      - 'plugins/udp_network_backend/**'
      - 'tests/network/**'
      - '.github/workflows/network.yaml'

permissions:
  contents: read

jobs:
  udp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/network -B build/network
      - run: cmake --build build/network --config Release
      - run: ctest --test-dir build/network -C Release --output-on-failure
